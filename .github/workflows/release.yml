name: Release

on:
  workflow_dispatch:

jobs:
  merge-develop:
    name: Merge develop into main
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch latest changes
        run: |
          git fetch origin main
          git fetch origin develop

      - name: Checkout main branch
        run: git checkout main

      - name: Merge develop into main
        run: |
          git merge origin/develop --no-edit
        env:
          GIT_MERGE_AUTOEDIT: no

      - name: Push merge to main
        run: git push origin main

  validate-build:
    name: Build Validation
    runs-on: ubuntu-latest
    needs: merge-develop
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build application
        run: pnpm build
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
          DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy?schema=public"
          BETTER_AUTH_SECRET: "ci-build-placeholder-min-32-chars-do-not-use"
          BETTER_AUTH_URL: "http://localhost:3000"
          RESEND_API_KEY: "ci-placeholder"
          BASE_URL: "http://localhost:3000"

      # Apply pending migrations to production before Vercel is allowed to
      # deploy (the gate status below). The new code expects the new schema,
      # so migrations go first; if they fail, the gate fails and the deploy is
      # blocked instead of shipping code against a stale database.
      # PRODUCTION_DATABASE_URL must be the Supabase session pooler URL
      # (port 5432): migrate deploy needs session-level locks, which the
      # transaction pooler (6543) doesn't support, and the direct host is
      # IPv6-only.
      - name: Apply database migrations (production)
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::PRODUCTION_DATABASE_URL secret is not set (Supabase session pooler URL, port 5432)."
            exit 1
          fi
          pnpm exec prisma migrate deploy

      - name: Publish deploy gate status for Vercel
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA=$(git rev-parse HEAD)
          if [ "${{ job.status }}" = "success" ]; then
            STATE=success
          else
            STATE=failure
          fi
          gh api --method POST "repos/${{ github.repository }}/statuses/${SHA}" \
            -f "state=${STATE}" \
            -f context="release/build-validation" \
            -f description="Release workflow Build Validation"

  tag-mcp-release:
    name: Tag MCP release
    runs-on: ubuntu-latest
    needs: validate-build
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag if server.json version is new
        id: tag
        run: |
          VERSION=$(jq -r .version server.json)
          TAG="v${VERSION}"

          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" > /dev/null 2>&1; then
            echo "Tag ${TAG} already exists — MCP server version unchanged this release, skipping."
            echo "tag=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${TAG}"
          git push origin "${TAG}"
          echo "Pushed tag ${TAG}."
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      # A tag pushed with GITHUB_TOKEN does NOT trigger other workflows' `on: push:
      # tags` events — GitHub suppresses this to prevent recursive workflow runs.
      # Dispatch the publish workflow explicitly instead of relying on that push.
      - name: Trigger MCP Registry publish
        if: steps.tag.outputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run publish-mcp.yml --ref "${{ steps.tag.outputs.tag }}"
